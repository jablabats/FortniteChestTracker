<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnite Treasure History</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101722; color: #f4f6fa; font: 15px system-ui, sans-serif; }
  main { max-width: 1040px; margin: auto; padding: 24px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p, caption { color: #a5afc0; }
  label { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  select { font: inherit; padding: 5px; }
  section { margin: 0 0 16px; overflow-x: auto; border: 1px solid #334054; border-radius: 10px; background: #1c2635; }
  h2 { font-size: 16px; margin: 0; padding: 12px; }
  table { width: 100%; min-width: 630px; border-collapse: collapse; text-align: left; }
  th, td { padding: 8px 12px; border-top: 1px solid #334054; vertical-align: top; }
  th { color: #ffd464; }
  td:last-child { overflow-wrap: anywhere; max-width: 330px; }
  section p { padding: 0 12px; }
</style>
<main>
  <h1>Treasure History</h1>
  <p id="status" role="status">Looking for local Fortnite replays…</p>
  <p>Times are relative to the replay. Some chests were first recorded after they had already opened. Inferred loot and locations use nearby container drops.</p>
  <label>Opened by
    <select id="filter">
      <option value="">Everyone shown</option>
      <option>You</option><option>Teammate</option><option>Unknown</option>
    </select>
  </label>
  <div id="matches"></div>
</main>
<script>
  const status = document.querySelector("#status");
  const matches = document.querySelector("#matches");
  const filter = document.querySelector("#filter");
  const date = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
  let data = { matches: [] };
  let lastBody = "";

  function element(tag, text) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function timestamp(seconds) {
    if (seconds === null) return "Unknown";
    const time = Math.max(0, Math.floor(seconds));
    return Math.floor(time / 60) + ":" + String(time % 60).padStart(2, "0");
  }

  function render() {
    matches.replaceChildren();
    if (data.matches.length === 0) {
      matches.append(element("p", "No completed replays have been imported yet."));
      return;
    }
    for (const match of [...data.matches].sort((a, b) => b.recorded_ms - a.recorded_ms)) {
      const section = element("section");
      section.append(element("h2", date.format(match.recorded_ms) + " · " + match.name));
      if (match.ammo_crates != null) {
        section.append(element("p", match.verified_chests + " counted · " + match.ammo_crates + " ammo crates"));
      }
      const entries = match.treasures.filter(treasure => !filter.value || treasure.opener === filter.value);
      if (!entries.length) {
        section.append(element("p", filter.value ? "No entries for this filter." : "No chest openings were decoded."));
        matches.append(section);
        continue;
      }
      const table = element("table");
      const header = table.createTHead().insertRow();
      for (const name of ["Time", "Location", "Source", "Opened by", "Nearby loot (inferred)"]) {
        const th = element("th", name);
        th.scope = "col";
        header.append(th);
      }
      const body = table.createTBody();
      for (const entry of entries) {
        const location = entry.position
          ? entry.position.map((value, i) => ["X", "Y", "Z"][i] + " " + Math.round(value / 100)).join(", ") + " m" +
            (entry.inferred_position ? " (inferred)" : "")
          : "Unknown";
        const loot = entry.loot.map(item =>
          item.item + (item.count ? " ×" + item.count : "") +
          (item.picked_up_by ? " (picked up by " + item.picked_up_by + ")" : "")
        ).join(", ");
        const row = body.insertRow();
        const time = timestamp(entry.seconds) + (entry.seconds !== null && !entry.opening_observed ? " (first seen open)" : "");
        for (const text of [time, location, entry.source, entry.opener, loot || "Unknown"]) {
          row.insertCell().textContent = text;
        }
      }
      section.append(table);
      matches.append(section);
    }
  }

  filter.addEventListener("change", render);

  async function refresh() {
    try {
      const response = await fetch("/treasure-data", { cache: "no-store" });
      if (!response.ok) throw Error("Treasure history unavailable");
      const body = await response.text();
      if (body !== lastBody) {
        data = JSON.parse(body);
        lastBody = body;
        render();
      }
      status.textContent = data.status || "Looking for local Fortnite replays…";
    } catch {
      status.textContent = "Tracker unavailable. Start it to refresh treasure history.";
    } finally {
      setTimeout(refresh, 2500);
    }
  }

  refresh();
</script>
</html>
