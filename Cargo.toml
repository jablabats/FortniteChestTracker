[package]
name = "fortnite-chest-tracker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
windows = { version = "0.61", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
